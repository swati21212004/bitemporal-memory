version: "3.9"

services:
  db:
    image: ankane/pgvector:latest
    container_name: bitemporal-memory-db
    environment:
      POSTGRES_USER: memory_user
      POSTGRES_PASSWORD: memory_pass
      POSTGRES_DB: memory_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_user -d memory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: bitemporal-memory-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://memory_user:memory_pass@db:5432/memory_db
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
