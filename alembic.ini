# Bitemporal AI Memory System — Alembic configuration.
#
# Run migrations with:
#   alembic upgrade head
#
# Generate new migrations with:
#   alembic revision --autogenerate -m "description"

[alembic]
# Path to the migration environment
script_location = alembic

# Template for new revision file names
file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps (UTC recommended)
timezone = UTC

# Async SQLAlchemy URL — override via env.py at runtime using settings.database_url
sqlalchemy.url = postgresql+asyncpg://memory_user:memory_pass@localhost:5432/memory_db

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
